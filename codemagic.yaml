workflows:
  android-debug-build:
    name: Android Debug Build
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Build debug APK
        script: |
          cd LocationTracker
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - LocationTracker/app/build/outputs/apk/debug/*.apk
