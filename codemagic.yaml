workflows:
  android-debug-build:
    name: Android Debug Build
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Show repo structure
        script: find . -maxdepth 3 -name "gradlew" -o -name "build.gradle" | head -20
      - name: Build debug APK
        script: |
          # Find gradlew wherever it is
          GRADLEW=$(find . -name "gradlew" | head -1)
          DIR=$(dirname "$GRADLEW")
          echo "Found gradlew at: $GRADLEW"
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - "**/outputs/apk/debug/*.apk"
