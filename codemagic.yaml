workflows:
  android-debug-build:
    name: Android Debug Build
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Install Gradle
        script: |
          brew install gradle || true
          gradle --version
      - name: Build debug APK
        script: |
          # Find build.gradle wherever it is
          BUILD=$(find . -name "build.gradle" -not -path "*/app/*" | head -1)
          DIR=$(dirname "$BUILD")
          echo "Project root: $DIR"
          cd "$DIR"
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - "**/outputs/apk/debug/*.apk"
